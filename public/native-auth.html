<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="no-referrer">
    <meta name="robots" content="noindex, nofollow, noarchive">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; base-uri 'none'; form-action 'none'">
    <title>Return to PipWise</title>
    <script src="/native-auth-return.js" defer></script>
  </head>
  <body>
    <main>
      <h1>Return to PipWise</h1>
      <p id="return-status" role="status" aria-live="polite" aria-atomic="true">Preparing your return to the app…</p>
      <p><a id="return-to-app" hidden rel="noreferrer">Open PipWise</a></p>
      <p><a href="/auth" rel="noreferrer">Back to sign in</a></p>
      <noscript><p>JavaScript is needed to return to the app. You can also go back to sign in and try again.</p></noscript>
    </main>
  </body>
</html>
