name: PipWise data retention

on:
  schedule:
    # Daily at 01:17 UTC / 04:17 Africa/Addis_Ababa, away from the hourly peak.
    - cron: '17 1 * * *'
  workflow_dispatch:
    inputs:
      execute:
        description: Permanently delete feedback eligible under the retention policy
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: pipwise-data-retention
  cancel-in-progress: false

jobs:
  purge_feedback:
    name: Enforce feedback retention
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the reviewed default-branch source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up the project Node runtime
        uses: actions/setup-node@v7
        with:
          node-version: '24.18.0'
          package-manager-cache: false
      - name: Set up the pinned package manager
        uses: pnpm/action-setup@v6
        with:
          version: '11.20.0'
          run_install: false
      - name: Install locked dependencies without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Preview eligible feedback without deleting it
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.execute != true }}
        env:
          RETENTION_JOB_DATABASE_URL: ${{ secrets.RETENTION_JOB_DATABASE_URL }}
        run: node scripts/purge-retained-data.mjs
      - name: Delete feedback eligible under the retention policy
        if: ${{ github.event_name == 'schedule' || inputs.execute == true }}
        env:
          RETENTION_JOB_DATABASE_URL: ${{ secrets.RETENTION_JOB_DATABASE_URL }}
        run: node scripts/purge-retained-data.mjs --execute
